<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{--color-background:#0B0F19;--color-surface:#1E293B;--color-surfaceAlt:#0F172A;--color-text:#F8FAFC;--color-textMuted:#94A3B8;--color-primary:#3B82F6;--color-accent:#8B5CF6;--color-danger:#EF4444;--color-warning:#F97316;--color-success:#10B981;--color-gold:#F59E0B;--color-white:#FFFFFF;--color-black:#000000;--font-display:"Montserrat", "Inter", "Helvetica Neue", "Arial", sans-serif;--font-body:"Inter", "Helvetica Neue", "Arial", sans-serif;--font-mono:ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;--radius-sm:8px;--radius-md:16px;--radius-lg:28px;--radius-xl:36px;--radius-pill:9999px;--shadow-text:0 10px 30px rgba(0,0,0,0.85), 0 2px 8px rgba(0,0,0,0.6);--shadow-card:0 25px 60px rgba(0,0,0,0.7);--shadow-soft:0 4px 14px rgba(0,0,0,0.6);--glow-color:#8B5CF6;--glow-blur:35px;--ease-arrival:power4.out;--ease-exit:power3.in;--ease-pop:back.out(1.7);--motion:standard}
html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:transparent}
body{font-family:var(--font-body)}
#root{position:relative;width:100%;height:100%}
.anchor{position:absolute;display:flex}
.clip{will-change:transform,opacity}
.wipe-clip{overflow:hidden}
.wipe-inner{will-change:transform}
.strike-host{position:relative;display:inline-block}
.strike-line{position:absolute;left:0;top:56%;width:100%;height:6.667px;background:var(--color-accent,#8B5CF6);border-radius:3.334px;transform:translateY(-50%) scaleX(0);transform-origin:0 50%;pointer-events:none}
.bg{pointer-events:none}
img{border:0}

</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
<div class="anchor" style="top:36px;left:64px;right:64px;bottom:36px;display:flex;justify-content:center;align-items:center;transform:translate(0px,0px)"><div id="glow-band-0" class="clip" data-start="0.15" data-duration="1.9" style="opacity:0.3;width:146.667px;height:153.333px;background:#F59E0B;border-radius:8px;transform:rotate(-12deg)"></div></div><div class="anchor" style="top:36px;left:64px;right:64px;bottom:36px;display:flex;justify-content:center;align-items:center;transform:translate(0px,0px)"><div id="glow-band-1" class="clip" data-start="1.27" data-duration="1.9" style="opacity:0.3;width:146.667px;height:153.333px;background:#F59E0B;border-radius:8px;transform:rotate(-12deg)"></div></div><div class="anchor" style="top:36px;left:64px;right:64px;bottom:36px;display:flex;justify-content:center;align-items:center;transform:translate(0px,0px)"><div id="glow-mask" class="clip" data-start="0" data-duration="5" style="display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;padding:86.667px;overflow:hidden"><div id="glow-text" class="clip" data-start="0.35" data-duration="4.65" style="font-family:&quot;Montserrat&quot;, &quot;Inter&quot;, &quot;Helvetica Neue&quot;, &quot;Arial&quot;, sans-serif;font-size:64px;font-weight:900;color:#FFFFFF;text-align:center;letter-spacing:-0.667px;text-shadow:0 10px 30px rgba(0,0,0,0.85), 0 2px 8px rgba(0,0,0,0.6), 0 4px 20px rgba(0,0,0,0.45), 0 0 40px #F59E0B">Launch Faster</div></div></div></div>
<script src="assets/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
window.__PARAMS = {"canvas":{"width":1280,"height":720,"fps":30,"durationSec":5,"output":"transparent","safeMargins":"action"}};
const tl = gsap.timeline({ paused: true });
    tl.fromTo('[id="glow-mask"]',{"opacity":0,"scale":0.92},{"opacity":1,"scale":1,"duration":0.45,"ease":"power4.out"},0.1);
    tl.fromTo('[id="glow-band-0"]',{"x":-1792},{"x":1792,"duration":1.6,"ease":"expo.inOut"},0.15);
    tl.fromTo('[id="glow-band-1"]',{"x":-1792},{"x":1792,"duration":1.6,"ease":"expo.inOut"},1.27);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
