html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:transparent}
body{font-family:var(--font-body)}
#root{position:relative;width:100%;height:100%}
.anchor{position:absolute;display:flex}
.clip{will-change:transform,opacity}
.wipe-clip{overflow:hidden}
.wipe-inner{will-change:transform}
.strike-host{position:relative;display:inline-block}
.strike-line{position:absolute;left:0;top:56%;width:100%;height:6.667px;background:var(--color-accent,#8B5CF6);border-radius:3.334px;transform:translateY(-50%) scaleX(0);transform-origin:0 50%;pointer-events:none}
.bg{pointer-events:none}
img{border:0}
