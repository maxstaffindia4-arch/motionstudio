name: render-smoke

on:
  push:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render smoke (docker)
        run: pnpm smoke:docker

      - name: Upload phase 0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-report
          path: spikes/render/docs/phase0-report.md
          if-no-files-found: warn
